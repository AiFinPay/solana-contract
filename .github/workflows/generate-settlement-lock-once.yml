name: generate-settlement-lock-once

on:
  push:
    branches:
      - release/settlement-v1-production-rc

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/settlement-v1-production-rc
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Generate and validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          test ! -e settlement-v1/Cargo.lock || { echo "Cargo.lock already exists"; exit 1; }
          cargo generate-lockfile --manifest-path settlement-v1/Cargo.toml
          cargo test --manifest-path settlement-v1/Cargo.toml --locked
          cargo check --manifest-path settlement-v1/Cargo.toml --locked
          test -s settlement-v1/Cargo.lock
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settlement-v1/Cargo.lock
          git commit -m "chore(solana): pin settlement dependency graph"
          git push origin HEAD:release/settlement-v1-production-rc
