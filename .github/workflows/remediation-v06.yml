name: Solana v0.6 fee-on-top remediation

on:
  push:
    branches:
      - security/fee-on-top-v0-6-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/fee-on-top-v0-6-remediation
      - uses: dtolnay/rust-toolchain@stable
      - name: Add replay-safe fee-on-top instruction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('contract/src/lib.rs')
          s = p.read_text()
          if 'pub fn b2b_pay_with_split(' in s:
              raise SystemExit(0)

          s = s.replace(
              'use anchor_lang::system_program;\n',
              'use anchor_lang::system_program;\nuse anchor_lang::solana_program::hash::hash;\n',
              1,
          )
          s = s.replace(
              'const B2B_IP_CREATOR_BPS: u64 = 1;   // 0.01% → IP creator (royalty)\n                                      // 98.99% → merchant (remainder)',
              'const B2B_IP_CREATOR_BPS: u64 = 1;   // 0.01% → IP creator (royalty), added on top\n                                      // merchant receives 100% of merchant_amount',
              1,
          )

          marker = '    /// AI agent reserves a seat via SOL donation.\n'
          fn = r'''    /// Execute an open-market B2B SOL payment using the current fee-on-top model.
    ///
    /// `merchant_amount_lamports` is the merchant's configured price. The payer
    /// transfers that full amount to the merchant, plus 1.00% AiFinPay treasury
    /// fee and 0.01% creator/referral fee on top. A payment receipt PDA derived
    /// from payer + SHA-256(order_id) makes successful payments single-use.
    pub fn b2b_pay_with_split(
        ctx: Context<B2bPayWithSplit>,
        merchant_amount_lamports: u64,
        payment_id: [u8; 32],
        order_id: String,
    ) -> Result<()> {
        require!(!ctx.accounts.config.is_paused, ErrorCode::ProtocolPaused);
        require!(!order_id.is_empty() && order_id.len() <= 64, ErrorCode::AgentIdTooLong);
        require!(merchant_amount_lamports > 0, ErrorCode::PaymentAmountInvalid);

        let expected_payment_id = hash(order_id.as_bytes()).to_bytes();
        require!(payment_id == expected_payment_id, ErrorCode::PaymentIdMismatch);

        let treasury_amount = merchant_amount_lamports
            .checked_mul(B2B_TREASURY_BPS)
            .ok_or(ErrorCode::MathOverflow)?
            .checked_div(BPS_DENOMINATOR)
            .ok_or(ErrorCode::MathOverflow)?;
        require!(treasury_amount > 0, ErrorCode::ProtocolFeeSettlementFailure);

        let ip_creator_amount = merchant_amount_lamports
            .checked_mul(B2B_IP_CREATOR_BPS)
            .ok_or(ErrorCode::MathOverflow)?
            .checked_div(BPS_DENOMINATOR)
            .ok_or(ErrorCode::MathOverflow)?;
        let total_amount = merchant_amount_lamports
            .checked_add(treasury_amount)
            .and_then(|v| v.checked_add(ip_creator_amount))
            .ok_or(ErrorCode::MathOverflow)?;

        // Merchant receives the exact configured price first.
        system_program::transfer(
            CpiContext::new(
                ctx.accounts.system_program.to_account_info(),
                system_program::Transfer {
                    from: ctx.accounts.agent.to_account_info(),
                    to: ctx.accounts.merchant_wallet.to_account_info(),
                },
            ),
            merchant_amount_lamports,
        )?;

        // If the creator account is the treasury, combine both protocol-side
        // fees into one transfer; otherwise transfer the slices independently.
        if ctx.accounts.ip_creator.key() == ctx.accounts.treasury.key() {
            let combined_fee = treasury_amount
                .checked_add(ip_creator_amount)
                .ok_or(ErrorCode::MathOverflow)?;
            system_program::transfer(
                CpiContext::new(
                    ctx.accounts.system_program.to_account_info(),
                    system_program::Transfer {
                        from: ctx.accounts.agent.to_account_info(),
                        to: ctx.accounts.treasury.to_account_info(),
                    },
                ),
                combined_fee,
            )?;
        } else {
            system_program::transfer(
                CpiContext::new(
                    ctx.accounts.system_program.to_account_info(),
                    system_program::Transfer {
                        from: ctx.accounts.agent.to_account_info(),
                        to: ctx.accounts.treasury.to_account_info(),
                    },
                ),
                treasury_amount,
            )?;
            if ip_creator_amount > 0 {
                system_program::transfer(
                    CpiContext::new(
                        ctx.accounts.system_program.to_account_info(),
                        system_program::Transfer {
                            from: ctx.accounts.agent.to_account_info(),
                            to: ctx.accounts.ip_creator.to_account_info(),
                        },
                    ),
                    ip_creator_amount,
                )?;
            }
        }

        let receipt = &mut ctx.accounts.payment_receipt;
        receipt.payer = ctx.accounts.agent.key();
        receipt.merchant = ctx.accounts.merchant_wallet.key();
        receipt.payment_id = payment_id;
        receipt.merchant_amount = merchant_amount_lamports;
        receipt.total_amount = total_amount;
        receipt.created_at = Clock::get()?.unix_timestamp;
        receipt.bump = ctx.bumps.payment_receipt;

        emit!(B2bPaymentEvent {
            payment_id,
            payer: ctx.accounts.agent.key(),
            merchant: ctx.accounts.merchant_wallet.key(),
            merchant_amount: merchant_amount_lamports,
            treasury_amount,
            ip_creator_amount,
            total_amount,
            order_id,
        });
        Ok(())
    }

'''
          if marker not in s:
              raise SystemExit('program insertion marker missing')
          s = s.replace(marker, fn + marker, 1)

          event_marker = '// ── Account Structs ───────────────────────────────────────────────────────────\n'
          event = r'''#[event]
pub struct B2bPaymentEvent {
    pub payment_id: [u8; 32],
    pub payer: Pubkey,
    pub merchant: Pubkey,
    pub merchant_amount: u64,
    pub treasury_amount: u64,
    pub ip_creator_amount: u64,
    pub total_amount: u64,
    pub order_id: String,
}

'''
          if event_marker not in s:
              raise SystemExit('event insertion marker missing')
          s = s.replace(event_marker, event + event_marker, 1)

          account_marker = '/// Agent Passport — on-chain sovereign identity for each AI agent.\n'
          account = r'''/// Single-use receipt for the open-market fee-on-top B2B path.
/// Seeds: ["b2b-payment", payer, payment_id]
#[account]
pub struct B2bPaymentReceipt {
    pub payer: Pubkey,
    pub merchant: Pubkey,
    pub payment_id: [u8; 32],
    pub merchant_amount: u64,
    pub total_amount: u64,
    pub created_at: i64,
    pub bump: u8,
}
impl B2bPaymentReceipt {
    pub const LEN: usize = 8 + 32 + 32 + 32 + 8 + 8 + 8 + 1;
}

'''
          if account_marker not in s:
              raise SystemExit('account insertion marker missing')
          s = s.replace(account_marker, account + account_marker, 1)

          ctx_marker = '#[derive(Accounts)]\n#[instruction(agent_id: String)]\npub struct ReserveSeatSol'
          ctx = r'''#[derive(Accounts)]
#[instruction(merchant_amount_lamports: u64, payment_id: [u8; 32], order_id: String)]
pub struct B2bPayWithSplit<'info> {
    #[account(seeds = [b"config"], bump = config.bump)]
    pub config: Account<'info, ProtocolConfig>,

    #[account(seeds = [b"vault"], bump = vault.bump)]
    pub vault: Account<'info, Vault>,

    #[account(
        init,
        payer = agent,
        space = B2bPaymentReceipt::LEN,
        seeds = [b"b2b-payment", agent.key().as_ref(), payment_id.as_ref()],
        bump
    )]
    pub payment_receipt: Account<'info, B2bPaymentReceipt>,

    #[account(mut)]
    pub agent: Signer<'info>,

    /// CHECK: canonical treasury is constrained to the Vault registry.
    #[account(mut, constraint = treasury.key() == vault.treasury @ ErrorCode::Unauthorized)]
    pub treasury: AccountInfo<'info>,

    /// CHECK: creator/referral recipient. It may equal treasury when no creator is used.
    #[account(mut)]
    pub ip_creator: AccountInfo<'info>,

    /// CHECK: merchant receiving wallet is bound into the receipt/event and
    /// validated against the trusted off-chain provider registry before signing.
    #[account(mut)]
    pub merchant_wallet: AccountInfo<'info>,

    pub system_program: Program<'info, System>,
}

'''
          if ctx_marker not in s:
              raise SystemExit('context insertion marker missing')
          s = s.replace(ctx_marker, ctx + ctx_marker, 1)

          err_marker = '    #[msg("IP creator wallet does not match passport record")]\n    InvalidIpCreator,\n'
          errs = '''    #[msg("B2B merchant amount must be positive")]\n    PaymentAmountInvalid,\n    #[msg("B2B payment_id must equal SHA-256(order_id)")]\n    PaymentIdMismatch,\n'''
          if err_marker not in s:
              raise SystemExit('error insertion marker missing')
          s = s.replace(err_marker, err_marker + errs, 1)
          p.write_text(s)
          PY
      - name: Rust format and compile
        working-directory: contract
        run: |
          cargo fmt -- --check || cargo fmt
          cargo check --locked
      - name: Commit source remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract/src/lib.rs
          git commit -m "security: add replay-safe Solana fee-on-top B2B instruction"
          git push origin HEAD:security/fee-on-top-v0-6-remediation
