name: settlement-v1-ci

on:
  pull_request:
    paths:
      - "settlement-v1/**"
      - ".github/workflows/settlement-v1-ci.yml"
  push:
    branches:
      - "release/settlement-v1-production-rc"
    paths:
      - "settlement-v1/**"
      - ".github/workflows/settlement-v1-ci.yml"

permissions:
  contents: read

jobs:
  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: settlement-v1
      - name: Toolchain evidence
        run: |
          rustc --version --verbose
          cargo --version --verbose
      - name: Cargo test
        shell: bash
        run: |
          set +e
          cargo test --manifest-path settlement-v1/Cargo.toml >cargo-test.log 2>&1
          status=$?
          cat cargo-test.log
          if [ "$status" -ne 0 ]; then
            excerpt=$(grep -E "(^error(\[|:)|error: could not compile| --> settlement-v1/)" cargo-test.log | tail -n 40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            if [ -z "$excerpt" ]; then excerpt=$(tail -n 30 cargo-test.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'); fi
            echo "::error title=Solana settlement-v1 cargo test failed::$excerpt"
            exit "$status"
          fi
      - name: Cargo check
        shell: bash
        run: |
          set +e
          cargo check --manifest-path settlement-v1/Cargo.toml >cargo-check.log 2>&1
          status=$?
          cat cargo-check.log
          if [ "$status" -ne 0 ]; then
            excerpt=$(grep -E "(^error(\[|:)|error: could not compile| --> settlement-v1/)" cargo-check.log | tail -n 40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            if [ -z "$excerpt" ]; then excerpt=$(tail -n 30 cargo-check.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'); fi
            echo "::error title=Solana settlement-v1 cargo check failed::$excerpt"
            exit "$status"
          fi
