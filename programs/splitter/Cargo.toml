[package]
name = "splitter"
version = "1.4.1"
description = "AiFinPay Solana splitter v1.4 — signed, multi-route gross settlement"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "splitter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token"] }
sha2 = "0.10.9"
solana-secp256k1-recover = "3.3.0"

[dev-dependencies]
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "sha2", "precomputed-tables"] }
sha2 = { version = "0.10.9", default-features = false }
rand = "0.8.8"
litesvm = "0.12"
solana-account = "3.0"
solana-pubkey = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.5"
solana-transaction = "3.1"
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
