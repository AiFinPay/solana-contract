[package]
name = "splitter"
version = "1.4.0"
description = "AiFinPay Solana splitter v1.4 — signed, multi-route gross settlement"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "splitter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token"] }
solana-secp256k1-recover = "3.3.0"
solana-keccak-hasher = "3.1.0"
solana-program = "4.1.0"

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4.5.0"
solana-transaction = "4.3.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "sha2", "precomputed-tables"] }
sha2 = { version = "0.11.0", default-features = false }
rand_core = { version = "0.10.1", default-features = false, features = ["getrandom"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
