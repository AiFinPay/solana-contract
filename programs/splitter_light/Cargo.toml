[package]
name = "splitter_light"
version = "0.1.0"
description = "AiFinPay Solana splitter light — fixed-route SOL + USDC/USDT settlement"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "splitter_light"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token"] }
solana-program = "4.1.0"
spl-token-interface = "3.0.0"
solana-secp256k1-recover = "3.3.0"

[dev-dependencies]
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "sha2", "precomputed-tables"] }
sha2 = { version = "0.10.9", default-features = false }
rand = "0.8.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
